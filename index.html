<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetricsHub Dashboard - Refactored</title>
    <!-- Nhúng Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- 1. NAVBAR (Sử dụng Flexbox để linh hoạt theo nội dung & ngôn ngữ) -->
    <header class="navbar-container">
        <div class="logo">MetricsHub</div>
        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">VeryLongGermanWordForDashboard</a>
            <a href="#">Contact</a>
        </nav>
        <div class="profile">Profile</div>
    </header>

    <!-- 2. DASHBOARD (Sử dụng CSS Grid để tạo layout Bento Box dạng 2D trực quan) -->
    <main class="dashboard-container">
        <div class="widget widget-large">Chart A (Span 2 rows)</div>
        <div class="widget">Chart B</div>
        <div class="widget">Chart C</div>
        <div class="widget">Chart D</div>
    </main>

    <!-- 3. PRICING SECTION (Sử dụng hệ thống lưới 12 cột chuẩn của Bootstrap 5) -->
    <section class="pricing-container container my-5">
        <h2 class="text-center mb-4">Bảng giá dịch vụ</h2>
        <div class="row g-4">
            <div class="col-12 col-md-4">
                <div class="card p-4 text-center shadow-sm">
                    <h3>Gói Cơ bản</h3>
                    <p class="text-muted">Phù hợp cá nhân khởi nghiệp</p>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card p-4 text-center shadow-sm border-primary">
                    <h3>Gói Nâng cao</h3>
                    <p class="text-muted">Dành cho team phát triển</p>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card p-4 text-center shadow-sm">
                    <h3>Gói Doanh nghiệp</h3>
                    <p class="text-muted">Giải pháp tối ưu toàn diện</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
