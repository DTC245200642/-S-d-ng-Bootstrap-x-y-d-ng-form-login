<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Photo Gallery - Bootstrap Grid</title>
    <!-- Nhúng Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container my-5">
        <h2 class="text-center mb-4">Thư Viện Ảnh Responsive</h2>
        
        <!-- Hàng chứa các cột ảnh -->
        <div class="row g-4">
            
            <!-- Ảnh 1 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card shadow-sm">
                    <img src="https://picsum.photos/id/1015/400/300" class="card-img-top" alt="Ảnh 1">
                    <div class="card-body">
                        <p class="card-text text-center">Phong cảnh thiên nhiên 1</p>
                    </div>
                </div>
            </div>

            <!-- Ảnh 2 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card shadow-sm">
                    <img src="https://picsum.photos/id/1016/400/300" class="card-img-top" alt="Ảnh 2">
                    <div class="card-body">
                        <p class="card-text text-center">Phong cảnh thiên nhiên 2</p>
                    </div>
                </div>
            </div>

            <!-- Ảnh 3 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card shadow-sm">
                    <img src="https://picsum.photos/id/1019/400/300" class="card-img-top" alt="Ảnh 3">
                    <div class="card-body">
                        <p class="card-text text-center">Phong cảnh thiên nhiên 3</p>
                    </div>
                </div>
            </div>

            <!-- Ảnh 4 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card shadow-sm">
                    <img src="https://picsum.photos/id/1020/400/300" class="card-img-top" alt="Ảnh 4">
                    <div class="card-body">
                        <p class="card-text text-center">Phong cảnh thiên nhiên 4</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Nhúng Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
